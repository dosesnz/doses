# .github/workflows/scrape.yml
# v2: pulls before pushing, so a commit made while the job is running no longer
#     causes "! [rejected] main -> main (fetch first)".

name: scrape-glp1-prices

on:
  schedule:
    - cron: "15 20 * * *"   # 20:15 UTC = 08:15 NZST (09:15 NZDT)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python glp1_scraper_v12.py

      - name: Commit results
        run: |
          git config user.name  "glp1-bot"
          git config user.email "glp1-bot@users.noreply.github.com"
          git add data/prices.csv
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "prices $(date -u +%F)"
          # Someone may have committed while this job ran. Rebase our single
          # commit on top of whatever is on main now, then push. Retry a couple
          # of times in case it happens again mid-push.
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push attempt $i failed, retrying"
            sleep 5
          done
          echo "could not push after 3 attempts"
          exit 1
